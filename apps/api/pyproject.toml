[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-ambulance-api"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
    "geoalchemy2",
    "pydantic-settings",
    "pyjwt",
    "argon2-cffi",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
